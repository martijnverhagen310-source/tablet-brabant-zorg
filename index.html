<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zorg Tablet</title>

<style>
body {
  font-family: Arial;
  background: #6bb6ff;
  margin: 0;
  text-align: center;
}

button {
  width: 90%;
  padding: 25px;
  margin: 10px;
  font-size: 24px;
  border-radius: 20px;
  border: none;
}

/* GROTE SVG ICONS */
.icon {
  width: 40px;
  height: 40px;
  vertical-align: middle;
}

.page { display:none; }
.active { display:block; }

.emergency {
  background: red;
  color: white;
  font-size: 28px;
}

.tv {
  background: black;
  color: white;
  padding: 40px;
  border-radius: 20px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <h1>🏠 Home</h1>

  <button class="emergency" onclick="nood()">🚨 NOOD</button>

  <button onclick="show('bellen')">📞 Bellen</button>
  <button onclick="show('tv')">📺 TV</button>
  <button onclick="show('reminders')">⏰ Herinnering</button>
  <button onclick="toggleVoice()">🔇 Stem aan/uit</button>
</div>

<!-- BELLEN -->
<div id="bellen" class="page">
  <h1>Bellen</h1>

  <button onclick="belZorg()">👩‍⚕️ Zorg</button>
  <button onclick="belFamilie()">👨‍👩‍👧 Familie</button>

  <button onclick="show('home')">⬅️ Terug</button>
</div>

<!-- TV -->
<div id="tv" class="page">
  <h1>TV</h1>

  <div class="tv" id="tvText">UIT</div>
  <div id="volumeText">Volume: 10</div>

  <button onclick="tv('on')">Aan</button>
  <button onclick="tv('off')">Uit</button>
  <button onclick="volumeUp()">🔊 +</button>
  <button onclick="volumeDown()">🔉 -</button>

  <button onclick="show('home')">⬅️ Terug</button>
</div>

<!-- REMINDERS -->
<div id="reminders" class="page">
  <h1>Herinnering</h1>

  <input id="text" placeholder="Wat?" style="padding:15px; font-size:20px;">
  <input id="time" type="time" style="padding:15px; font-size:20px;">

  <button onclick="addReminder()">Opslaan</button>

  <div id="list"></div>

  <button onclick="show('home')">⬅️ Terug</button>
</div>

<script>

/* NAV */
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* STEM */
let voice = true;
let speakTimer;

function speak(text){
  if(!voice) return;

  clearTimeout(speakTimer);

  speakTimer = setTimeout(()=>{
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  },2000);
}

function toggleVoice(){
  voice = !voice;
  alert("Stem " + (voice ? "AAN" : "UIT"));
}

/* NOOD */
function nood(){
  speak("Noodhulp");
  navigator.vibrate?.(200);
  window.open("tel:112");
}

/* BELLEN */
function belZorg(){
  speak("Zorgverlener");
  window.open("https://wa.me/31612223226");
}

function belFamilie(){
  speak("Familie");
  window.open("https://wa.me/31600000000");
}

/* TV */
let volume = 10;

function tv(x){
  tvText.innerText = x === "on" ? "AAN" : "UIT";
  speak("TV " + tvText.innerText);
}

function volumeUp(){
  volume++;
  updateVolume();
}

function volumeDown(){
  volume--;
  updateVolume();
}

function updateVolume(){
  volumeText.innerText = "Volume: " + volume;
  speak("Volume " + volume);
}

/* HERINNERINGEN */
function addReminder(){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  arr.push({
    text: text.value,
    time: time.value
  });

  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

function load(){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  list.innerHTML = arr.map((r,i)=>
    `<div>${r.text} - ${r.time}
    <button onclick="del(${i})">❌</button></div>`
  ).join("");
}

function del(i){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");
  arr.splice(i,1);
  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

/* NOTIFICATIES */
function checkReminders(){
  let now = new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  arr.forEach(r=>{
    if(r.time === now){
      new Notification("Herinnering: " + r.text);
      speak(r.text);
    }
  });
}

setInterval(checkReminders,60000);

if(Notification.permission !== "granted"){
  Notification.requestPermission();
}

load();

/* SERVICE WORKER */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}

</script>

</body>
</html>
