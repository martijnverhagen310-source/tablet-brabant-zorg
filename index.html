<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zorg Tablet</title>

<style>
html, body {
  margin: 0;
  font-family: Arial;
  background: #6bb6ff;
  text-align: center;
  touch-action: none;
}

.page { display:none; }
.active { display:block; }

button {
  width: 95%;
  height: 140px;
  margin: 10px;
  font-size: 34px;
  border-radius: 25px;
  border: none;
}

.white { background: white; }
.red { background: red; color: white; }

.box {
  background: white;
  margin: 10px;
  padding: 20px;
  border-radius: 20px;
  font-size: 26px;
}

input {
  width: 90%;
  padding: 20px;
  font-size: 24px;
  border-radius: 15px;
  border: none;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <h1>🏠</h1>

  <button class="white" onclick="tap(()=>show('tv'))">📺 TV</button>
  <button class="white" onclick="tap(()=>show('call'))">📞 BELLEN</button>
  <button class="white" onclick="tap(()=>show('rem'))">⏰ HERINNERING</button>
</div>

<!-- TV -->
<div id="tv" class="page">
  <h1>📺 TV</h1>

  <div class="box">Status: verbonden of niet zie console</div>

  <button onclick="tap(connectTV)">🔌 VERBIND TV</button>

  <button onclick="tap(()=>sendKey('KEY_POWER'))">AAN / UIT</button>

  <button onclick="tap(()=>sendKey('KEY_CHUP'))">📺 ZENDER +</button>
  <button onclick="tap(()=>sendKey('KEY_CHDOWN'))">📺 ZENDER -</button>

  <button onclick="tap(()=>sendKey('KEY_VOLUP'))">🔊 VOLUME +</button>
  <button onclick="tap(()=>sendKey('KEY_VOLDOWN'))">🔉 VOLUME -</button>

  <button onclick="tap(()=>show('home'))">⬅️ TERUG</button>
</div>

<!-- CALL -->
<div id="call" class="page">
  <h1>📞</h1>

  <button onclick="tap(belZorg)">👩‍⚕️ ZORG</button>
  <button onclick="tap(belFamilie)">👨‍👩‍👧 FAMILIE</button>

  <button onclick="tap(()=>show('home'))">⬅️ TERUG</button>
</div>

<!-- REMINDER -->
<div id="rem" class="page">
  <h1>⏰</h1>

  <input id="text" placeholder="Wat?">
  <input id="time" type="time">

  <button onclick="tap(saveReminder)">OPSLAAN</button>

  <div id="list"></div>

  <button onclick="tap(()=>show('home'))">⬅️ TERUG</button>
</div>

<script>

/* ======================
   🔧 PAS DIT AAN
====================== */

// 👇 VUL HIER JE TV IP IN
const TV_IP = "192.168.1.45";

/* ======================
   ZOOM FIX
====================== */

let lastTap = 0;
document.addEventListener("touchend", e=>{
  let now = Date.now();
  if(now - lastTap < 350){
    e.preventDefault();
  }
  lastTap = now;
}, {passive:false});

document.addEventListener("gesturestart", e=>e.preventDefault());

/* ======================
   AUDIO FIX
====================== */

let audioReady = false;

function unlockAudio(){
  if(audioReady) return;
  speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
  audioReady = true;
}

/* ======================
   TAP FIX
====================== */

function tap(fn){
  unlockAudio();
  navigator.vibrate?.(50);
  fn();
}

/* ======================
   NAV
====================== */

function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ======================
   📺 SAMSUNG TV
====================== */

let ws;

function connectTV(){
  ws = new WebSocket(`ws://${TV_IP}:8001/api/v2/channels/samsung.remote.control`);

  ws.onopen = () => {
    alert("Verbonden met TV ✅");
  };

  ws.onerror = () => {
    alert("Verbinding mislukt ❌");
  };
}

function sendKey(key){
  if(!ws || ws.readyState !== 1){
    alert("Eerst verbinden!");
    return;
  }

  ws.send(JSON.stringify({
    method: "ms.remote.control",
    params: {
      Cmd: "Click",
      DataOfCmd: key,
      Option: "false",
      TypeOfRemote: "SendRemoteKey"
    }
  }));
}

/* ======================
   BELLEN
====================== */

function belZorg(){
  window.open("https://wa.me/31612223226");
}

function belFamilie(){
  window.open("https://wa.me/31600000000");
}

/* ======================
   HERINNERING
====================== */

function saveReminder(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  arr.push({
    text: text.value,
    time: time.value
  });

  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

function load(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  list.innerHTML = arr.map((r,i)=>
    `<div style="font-size:24px; margin:10px;">
      ${r.text} - ${r.time}
      <button onclick="tap(()=>del(${i}))">❌</button>
    </div>`
  ).join("");
}

function del(i){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");
  arr.splice(i,1);
  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

load();

</script>

</body>
</html>
