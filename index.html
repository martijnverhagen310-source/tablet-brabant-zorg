<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Zorg Tablet</title>

<style>
html, body {
  margin: 0;
  font-family: Arial;
  background: #6bb6ff;
  text-align: center;
  touch-action: none;
}

.page { display:none; }
.active { display:block; }

button {
  width: 95%;
  height: 130px;
  margin: 10px;
  font-size: 34px;
  border-radius: 25px;
  border: none;
}

.red { background: red; color: white; }
.white { background: white; }

.box {
  background: white;
  margin: 10px;
  padding: 20px;
  border-radius: 20px;
  font-size: 28px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <h1>🏠</h1>

  <button class="red" onclick="tap(nood)">🚨 NOOD</button>
  <button class="white" onclick="tap(()=>show('call'))">📞 BELLEN</button>
  <button class="white" onclick="tap(()=>show('info'))">📺 INFO</button>
</div>

<!-- BELLEN -->
<div id="call" class="page">
  <h1>📞</h1>

  <button onclick="tap(belZorg)">👩‍⚕️ ZORG</button>
  <button onclick="tap(belFamilie)">👨‍👩‍👧 FAMILIE</button>

  <button onclick="tap(()=>show('home'))">⬅️</button>
</div>

<!-- INFO (TV + TIJD + ETEN) -->
<div id="info" class="page">
  <h1>📺 INFO</h1>

  <div class="box" id="timeBox">Tijd: --:--</div>

  <div class="box" id="tvBox">TV: UIT</div>
  <button onclick="tap(tvOn)">TV AAN</button>
  <button onclick="tap(tvOff)">TV UIT</button>

  <div class="box" id="etenBox">Eten: niet ingesteld</div>
  <input id="etenInput" placeholder="Eten van vandaag">
  <button onclick="tap(saveEten)">OPSLAAN</button>

  <button onclick="tap(()=>show('home'))">⬅️</button>
</div>

<script>

/* ======================
   ZOOM FIX
====================== */

let lastTap = 0;
document.addEventListener("touchend", e=>{
  let now = Date.now();
  if(now - lastTap < 350){
    e.preventDefault();
  }
  lastTap = now;
}, {passive:false});

document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("gesturechange", e=>e.preventDefault());

/* ======================
   SAFE TAP
====================== */

let lastAction = 0;

function tap(fn){
  let now = Date.now();
  if(now - lastAction < 400) return;
  lastAction = now;

  unlockAudio();
  navigator.vibrate?.(50);
  fn();
}

/* ======================
   AUDIO
====================== */

let audioReady = false;

function unlockAudio(){
  if(audioReady) return;
  speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
  audioReady = true;
}

/* ======================
   NAV
====================== */

function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  if(id === "info") updateInfo();
}

/* ======================
   NOOD + BELLEN
====================== */

function nood(){
  alert("NOODHULP");
  window.open("tel:112");
}

function belZorg(){
  window.open("https://wa.me/31612223226");
}

function belFamilie(){
  window.open("https://wa.me/31600000000");
}

/* ======================
   TV
====================== */

let tv = false;

function tvOn(){
  tv = true;
  document.getElementById("tvBox").innerText = "TV: AAN";
}

function tvOff(){
  tv = false;
  document.getElementById("tvBox").innerText = "TV: UIT";
}

/* ======================
   ETEN
====================== */

function saveEten(){
  localStorage.setItem("eten", etenInput.value);
  updateInfo();
}

/* ======================
   INFO UPDATE
====================== */

function updateInfo(){
  let now = new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("timeBox").innerText = "Tijd: " + now;

  document.getElementById("etenBox").innerText =
    "Eten: " + (localStorage.getItem("eten") || "niet ingesteld");
}

/* auto update tijd */
setInterval(()=>{
  if(document.getElementById("info").classList.contains("active")){
    updateInfo();
  }
},1000);

</script>

</body>
</html>
