<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zorg Tablet</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #6bb6ff;
  text-align: center;
  touch-action: manipulation;
}

/* PAGINA */
.page { display:none; }
.active { display:block; }

/* MEGA KNOPPEN */
button {
  width: 95%;
  height: 130px;
  margin: 10px;
  font-size: 34px;
  border-radius: 25px;
  border: none;
}

/* KLEUREN */
.red { background: red; color: white; }
.white { background: white; }

/* INPUT */
input {
  width: 90%;
  padding: 20px;
  font-size: 24px;
  border-radius: 15px;
  border: none;
  margin: 10px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <h1>🏠</h1>

  <button class="red" onclick="clickFix(nood)">🚨 NOOD</button>
  <button class="white" onclick="clickFix(()=>show('call'))">📞 BELLEN</button>
  <button class="white" onclick="clickFix(()=>show('rem'))">⏰ HERINNERING</button>
  <button onclick="clickFix(toggleVoice)">🔇 STEM</button>
</div>

<!-- BELLEN -->
<div id="call" class="page">
  <h1>📞</h1>

  <button onclick="clickFix(belZorg)">👩‍⚕️ ZORG</button>
  <button onclick="clickFix(belFamilie)">👨‍👩‍👧 FAMILIE</button>

  <button onclick="clickFix(()=>show('home'))">⬅️</button>
</div>

<!-- HERINNERING -->
<div id="rem" class="page">
  <h1>⏰</h1>

  <input id="text" placeholder="Wat?">
  <input id="time" type="time">

  <button onclick="clickFix(addReminder)">OPSLAAN</button>

  <div id="list"></div>

  <button onclick="clickFix(()=>show('home'))">⬅️</button>
</div>

<script>

/* ======================
   iPAD FIXES
====================== */

// voorkom dubbelklik zoom
let lastTouch = 0;
document.addEventListener("touchend", function (e) {
  const now = Date.now();
  if (now - lastTouch <= 300) {
    e.preventDefault();
  }
  lastTouch = now;
}, false);

// voorkom pinch zoom
document.addEventListener('gesturestart', e => e.preventDefault());

/* ======================
   CLICK BESCHERMING
====================== */

let lastClick = 0;

function clickFix(fn){
  const now = Date.now();
  if(now - lastClick < 500) return; // blokkeer spam klikken
  lastClick = now;

  unlockAudio();
  navigator.vibrate?.(50);
  fn();
}

/* ======================
   AUDIO FIX (iPad)
====================== */

let audioUnlocked = false;
let voice = true;
let timer;

function unlockAudio(){
  if(audioUnlocked) return;

  speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  audioUnlocked = true;
}

function speak(text){
  if(!voice || !audioUnlocked) return;

  clearTimeout(timer);

  timer = setTimeout(()=>{
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  },2000);
}

function toggleVoice(){
  voice = !voice;
  alert("Stem " + (voice ? "AAN" : "UIT"));
}

/* ======================
   NAV
====================== */

function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ======================
   NOOD
====================== */

function nood(){
  speak("Noodhulp");
  window.open("tel:112");
}

/* ======================
   BELLEN
====================== */

function belZorg(){
  speak("Zorgverlener");
  window.open("https://wa.me/31612223226");
}

function belFamilie(){
  speak("Familie");
  window.open("https://wa.me/31600000000");
}

/* ======================
   HERINNERING
====================== */

function addReminder(){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  arr.push({
    text: text.value,
    time: time.value
  });

  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

function load(){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  list.innerHTML = arr.map((r,i)=>
    `<div style="font-size:24px; margin:10px;">
      ${r.text} - ${r.time}
      <button onclick="clickFix(()=>del(${i}))">❌</button>
    </div>`
  ).join("");
}

function del(i){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");
  arr.splice(i,1);
  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

/* ======================
   NOTIFICATIES
====================== */

function check(){
  let now = new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  arr.forEach(r=>{
    if(r.time === now){
      new Notification("Herinnering: " + r.text);
      speak(r.text);
    }
  });
}

setInterval(check,60000);

if(Notification.permission !== "granted"){
  Notification.requestPermission();
}

load();

</script>

</body>
</html>
