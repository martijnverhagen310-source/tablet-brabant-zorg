<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Zorg Tablet</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: Arial;
  background: #6bb6ff;

  /* 🔥 HARD ZOOM BLOCK */
  touch-action: none;
  -ms-touch-action: none;
  overscroll-behavior: none;
}

/* extra iOS zoom block */
* {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.page { display:none; }
.active { display:block; }

button {
  width: 95%;
  height: 140px;
  margin: 10px;
  font-size: 36px;
  border-radius: 25px;
  border: none;
}

.red { background: red; color: white; }
.white { background: white; }

input {
  width: 90%;
  padding: 20px;
  font-size: 26px;
  border-radius: 15px;
  border: none;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <h1>🏠</h1>

  <button class="red" onclick="tap(nood)">🚨 NOOD</button>
  <button class="white" onclick="tap(()=>show('call'))">📞 BELLEN</button>
  <button class="white" onclick="tap(()=>show('rem'))">⏰ HERINNERING</button>
  <button onclick="tap(toggleVoice)">🔊 STEM</button>
</div>

<!-- BELLEN -->
<div id="call" class="page">
  <h1>📞</h1>

  <button onclick="tap(belZorg)">👩‍⚕️ ZORG</button>
  <button onclick="tap(belFamilie)">👨‍👩‍👧 FAMILIE</button>

  <button onclick="tap(()=>show('home'))">⬅️</button>
</div>

<!-- HERINNERING -->
<div id="rem" class="page">
  <h1>⏰</h1>

  <input id="text" placeholder="Wat?">
  <input id="time" type="time">

  <button onclick="tap(addReminder)">OPSLAAN</button>

  <div id="list"></div>

  <button onclick="tap(()=>show('home'))">⬅️</button>
</div>

<script>

/* ======================
   ZOOM FIX (ECHT HARD)
====================== */

// blok double tap zoom
let lastTap = 0;
document.addEventListener("touchend", function(e){
  let now = Date.now();
  if(now - lastTap < 350){
    e.preventDefault();
  }
  lastTap = now;
}, {passive:false});

// blok pinch zoom
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
document.addEventListener("gestureend", e => e.preventDefault());

/* ======================
   SAFE TAP WRAPPER
====================== */

let lastAction = 0;

function tap(fn){
  let now = Date.now();
  if(now - lastAction < 400) return;
  lastAction = now;

  unlockAudio();
  fn();
}

/* ======================
   AUDIO FIX (iPad SAFE)
====================== */

let audioReady = false;
let voice = true;
let timer;

function unlockAudio(){
  if(audioReady) return;

  const u = new SpeechSynthesisUtterance(" ");
  speechSynthesis.speak(u);

  audioReady = true;
}

function speak(text){
  if(!voice || !audioReady) return;

  clearTimeout(timer);

  timer = setTimeout(()=>{
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "nl-NL";
    speechSynthesis.speak(msg);
  }, 1500);
}

function toggleVoice(){
  voice = !voice;
  alert("Stem: " + (voice ? "AAN" : "UIT"));
}

/* ======================
   NAV
====================== */

function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ======================
   FUNCTIES
====================== */

function nood(){
  speak("Noodhulp");
  window.open("tel:112");
}

function belZorg(){
  speak("Zorg");
  window.open("https://wa.me/31612223226");
}

function belFamilie(){
  speak("Familie");
  window.open("https://wa.me/31600000000");
}

/* ======================
   HERINNERING
====================== */

function addReminder(){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  arr.push({
    text: text.value,
    time: time.value
  });

  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

function load(){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  list.innerHTML = arr.map((r,i)=>
    `<div style="font-size:26px; margin:12px;">
      ${r.text} - ${r.time}
      <button onclick="tap(()=>del(${i}))">❌</button>
    </div>`
  ).join("");
}

function del(i){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");
  arr.splice(i,1);
  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

/* ======================
   NOTIFICATIES
====================== */

setInterval(()=>{
  let now = new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  arr.forEach(r=>{
    if(r.time === now){
      new Notification("Herinnering: " + r.text);
      speak(r.text);
    }
  });
},60000);

if(Notification.permission !== "granted"){
  Notification.requestPermission();
}

load();

</script>

</body>
</html>
