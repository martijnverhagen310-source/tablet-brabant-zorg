<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zorg Tablet</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #6bb6ff;
  text-align: center;
}

.page { display:none; }
.active { display:block; }

button {
  width: 95%;
  height: 120px;
  margin: 10px;
  font-size: 32px;
  border-radius: 25px;
  border: none;
}

.red { background: red; color: white; }
.white { background: white; }

input {
  width: 90%;
  padding: 20px;
  font-size: 24px;
  border-radius: 15px;
  border: none;
  margin: 10px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <h1>🏠 Home</h1>

  <button class="red" onclick="nood()">🚨 NOODHULP</button>
  <button class="white" onclick="show('call')">📞 BELLEN</button>
  <button class="white" onclick="show('rem')">⏰ HERINNERING</button>
  <button onclick="toggleVoice()">🔇 STEM AAN/UIT</button>
</div>

<!-- BELLEN -->
<div id="call" class="page">
  <h1>Bellen</h1>

  <button onclick="belZorg()">👩‍⚕️ ZORG</button>
  <button onclick="belFamilie()">👨‍👩‍👧 FAMILIE</button>

  <button onclick="show('home')">⬅️ TERUG</button>
</div>

<!-- HERINNERING -->
<div id="rem" class="page">
  <h1>Herinnering</h1>

  <input id="text" placeholder="Wat?">
  <input id="time" type="time">

  <button onclick="addReminder()">OPSLAAN</button>

  <div id="list"></div>

  <button onclick="show('home')">⬅️ TERUG</button>
</div>

<script>

/* ======================
   AUTO START (GEEN LOGIN)
====================== */

window.onload = function(){
  // eerste keer check (optioneel)
  if(!localStorage.getItem("setupDone")){
    let code = prompt("Instelcode (eenmalig):");

    if(code === "6767"){
      localStorage.setItem("setupDone","true");
      alert("Klaar!");
    } else {
      alert("Foute code");
      location.reload();
    }
  }
}

/* NAV */
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* STEM */
let voice = true;
let timer;

function speak(text){
  if(!voice) return;

  clearTimeout(timer);

  timer = setTimeout(()=>{
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  },2000);
}

function toggleVoice(){
  voice = !voice;
  alert("Stem " + (voice ? "AAN" : "UIT"));
}

/* NOOD */
function nood(){
  speak("Noodhulp wordt gebeld");
  navigator.vibrate?.(200);
  window.open("tel:112");
}

/* BELLEN */
function belZorg(){
  speak("Zorgverlener");
  window.open("https://wa.me/31612223226");
}

function belFamilie(){
  speak("Familie");
  window.open("https://wa.me/31600000000");
}

/* HERINNERING */
function addReminder(){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  arr.push({
    text: text.value,
    time: time.value
  });

  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

function load(){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  list.innerHTML = arr.map((r,i)=>
    `<div>${r.text} - ${r.time}
    <button onclick="del(${i})">❌</button></div>`
  ).join("");
}

function del(i){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");
  arr.splice(i,1);
  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

/* NOTIFICATIES */
function check(){
  let now = new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  arr.forEach(r=>{
    if(r.time === now){
      new Notification("Herinnering: " + r.text);
      speak(r.text);
    }
  });
}

setInterval(check,60000);

if(Notification.permission !== "granted"){
  Notification.requestPermission();
}

load();

</script>

</body>
</html>
