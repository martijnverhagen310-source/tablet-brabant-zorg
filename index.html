<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zorg Tablet</title>

<style>
html, body {
  margin: 0;
  font-family: Arial;
  background: #6bb6ff;
  text-align: center;
  touch-action: none;
}

.page { display:none; }
.active { display:block; }

button {
  width: 95%;
  height: 140px;
  margin: 10px;
  font-size: 38px;
  border-radius: 25px;
  border: none;
}

.red { background: red; color: white; }
.white { background: white; }

.box {
  background: white;
  margin: 10px;
  padding: 20px;
  border-radius: 20px;
  font-size: 28px;
}

input {
  width: 90%;
  padding: 20px;
  font-size: 26px;
  border-radius: 15px;
  border: none;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <h1>🏠</h1>

  <button class="white" onclick="tap(()=>show('tv'))">📺 TV</button>
  <button class="white" onclick="tap(()=>show('call'))">📞 BELLEN</button>
  <button class="white" onclick="tap(()=>show('rem'))">⏰ HERINNERING</button>
</div>

<!-- TV -->
<div id="tv" class="page">
  <h1>📺 TV</h1>

  <div class="box" id="tvStatus">TV: UIT</div>

  <button onclick="tap(tvOn)">AAN</button>
  <button onclick="tap(tvOff)">UIT</button>

  <button onclick="tap(()=>show('home'))">⬅️ TERUG</button>
</div>

<!-- CALL -->
<div id="call" class="page">
  <h1>📞</h1>

  <button onclick="tap(belZorg)">👩‍⚕️ ZORG</button>
  <button onclick="tap(belFamilie)">👨‍👩‍👧 FAMILIE</button>

  <button onclick="tap(()=>show('home'))">⬅️ TERUG</button>
</div>

<!-- REMINDER -->
<div id="rem" class="page">
  <h1>⏰</h1>

  <input id="text" placeholder="Wat?">
  <input id="time" type="time">

  <button onclick="tap(saveReminder)">OPSLAAN</button>

  <div id="list"></div>

  <button onclick="tap(()=>show('home'))">⬅️ TERUG</button>
</div>

<script>

/* ======================
   ZOOM FIX iPAD
====================== */

let lastTap = 0;

document.addEventListener("touchend", e=>{
  let now = Date.now();
  if(now - lastTap < 350){
    e.preventDefault();
  }
  lastTap = now;
}, {passive:false});

document.addEventListener("gesturestart", e=>e.preventDefault());

/* ======================
   AUDIO FIX (BELANGRIJK)
====================== */

let audioReady = false;
let voice = true;
let timer;

function unlockAudio(){
  if(audioReady) return;
  speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
  audioReady = true;
}

function speak(text){
  if(!voice || !audioReady) return;

  clearTimeout(timer);

  timer = setTimeout(()=>{
    speechSynthesis.cancel();
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "nl-NL";
    speechSynthesis.speak(msg);
  }, 1500);
}

/* ======================
   SAFE TAP
====================== */

function tap(fn){
  unlockAudio();
  navigator.vibrate?.(50);
  fn();
}

/* ======================
   NAV
====================== */

function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ======================
   TV
====================== */

let tv = false;

function tvOn(){
  tv = true;
  document.getElementById("tvStatus").innerText = "TV: AAN";
  speak("TV aan");
}

function tvOff(){
  tv = false;
  document.getElementById("tvStatus").innerText = "TV: UIT";
  speak("TV uit");
}

/* ======================
   BELLEN
====================== */

function belZorg(){
  speak("Zorgverlener bellen");
  window.open("https://wa.me/31612223226");
}

function belFamilie(){
  speak("Familie bellen");
  window.open("https://wa.me/31600000000");
}

/* ======================
   HERINNERING
====================== */

function saveReminder(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  arr.push({
    text: text.value,
    time: time.value
  });

  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

function load(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  list.innerHTML = arr.map((r,i)=>
    `<div style="font-size:26px; margin:10px;">
      ${r.text} - ${r.time}
      <button onclick="tap(()=>del(${i}))">❌</button>
    </div>`
  ).join("");
}

function del(i){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");
  arr.splice(i,1);
  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

/* ======================
   HERINNERING CHECK
====================== */

setInterval(()=>{
  let now = new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  arr.forEach(r=>{
    if(r.time === now){
      speak(r.text);
      new Notification("Herinnering: " + r.text);
    }
  });
},60000);

if(Notification.permission !== "granted"){
  Notification.requestPermission();
}

load();

</script>

</body>
</html>
