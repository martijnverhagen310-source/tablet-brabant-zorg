<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Zorg Tablet</title>

<style>
html, body {
  margin: 0;
  font-family: Arial;
  background: #6bb6ff;
  overflow: hidden;
}

/* SLIDER */
#container {
  display: flex;
  width: 400vw;
  height: 100vh;
  transition: transform 0.4s ease;
}

.page {
  width: 100vw;
  height: 100vh;
  text-align: center;
  padding: 20px;
  box-sizing: border-box;
}

button {
  width: 90%;
  height: 120px;
  margin: 10px;
  font-size: 34px;
  border-radius: 25px;
  border: none;
}

.box {
  background: white;
  padding: 20px;
  margin: 10px;
  border-radius: 20px;
  font-size: 26px;
}

.nav {
  position: fixed;
  bottom: 10px;
  width: 100%;
  display: flex;
  justify-content: space-between;
}

.nav button {
  width: 45%;
  height: 80px;
  font-size: 30px;
}
</style>
</head>

<body>

<div id="container">

<!-- HOME -->
<div class="page">
  <h1>🏠</h1>

  <button onclick="nood()">🚨 NOOD</button>
  <button onclick="go(1)">📺 TV</button>
  <button onclick="go(2)">📞 BELLEN</button>
  <button onclick="go(3)">⏰ HERINNERING</button>
</div>

<!-- TV -->
<div class="page">
  <h1>📺 TV</h1>

  <div class="box" id="tv">TV UIT</div>
  <div class="box" id="vol">Volume: 10</div>
  <div class="box" id="ch">Zender: 1</div>

  <button onclick="volUp()">🔊 +</button>
  <button onclick="volDown()">🔉 -</button>

  <button onclick="chUp()">📺 +</button>
  <button onclick="chDown()">📺 -</button>
</div>

<!-- CALL -->
<div class="page">
  <h1>📞</h1>

  <button onclick="belZorg()">👩‍⚕️ ZORG</button>
  <button onclick="belFamilie()">👨‍👩‍👧 FAMILIE</button>
</div>

<!-- REMINDER -->
<div class="page">
  <h1>⏰</h1>

  <input id="text" placeholder="Wat?">
  <input id="time" type="time">

  <button onclick="save()">OPSLAAN</button>

  <div id="list"></div>
</div>

</div>

<!-- NAV -->
<div class="nav">
  <button onclick="prev()">⬅️</button>
  <button onclick="next()">➡️</button>
</div>

<script>

let page = 0;

/* SLIDE NAV */
function go(i){
  page = i;
  update();
}

function next(){
  if(page < 3) page++;
  update();
}

function prev(){
  if(page > 0) page--;
  update();
}

function update(){
  document.getElementById("container").style.transform =
    `translateX(-${page * 100}vw)`;
}

/* TV */
let volume = 10;
let channel = 1;

function volUp(){
  volume++;
  vol.innerText = "Volume: " + volume;
}

function volDown(){
  volume--;
  vol.innerText = "Volume: " + volume;
}

function chUp(){
  channel++;
  ch.innerText = "Zender: " + channel;
}

function chDown(){
  if(channel > 1) channel--;
  ch.innerText = "Zender: " + channel;
}

/* BELLEN */
function belZorg(){
  window.open("https://wa.me/31612223226");
}

function belFamilie(){
  window.open("https://wa.me/31600000000");
}

/* HERINNERING */
function save(){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  arr.push({
    text: text.value,
    time: time.value
  });

  localStorage.setItem("rem", JSON.stringify(arr));
  load();
}

function load(){
  let arr = JSON.parse(localStorage.getItem("rem")||"[]");

  list.innerHTML = arr.map(r=>`
    <div class="box">${r.text} - ${r.time}</div>
  `).join("");
}

load();

</script>

</body>
</html>
