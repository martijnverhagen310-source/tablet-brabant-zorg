<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zorg App</title>

<style>
html, body {
  margin: 0;
  font-family: Arial;
  background: #6bb6ff;
  text-align: center;
  overflow: hidden;
}

/* NAV */
#menu {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
}

#menu button {
  flex: 1;
  height: 80px;
  font-size: 20px;
  border: none;
}

/* PAGES */
.page {
  display: none;
  padding: 20px;
}

.active {
  display: block;
}

/* BUTTONS */
button {
  width: 95%;
  height: 110px;
  margin: 10px;
  font-size: 30px;
  border-radius: 20px;
  border: none;
}

.box {
  background: white;
  padding: 15px;
  margin: 10px;
  border-radius: 15px;
  font-size: 22px;
}

.red { background: red; color: white; }
.white { background: white; }
</style>
</head>

<body>

<!-- TV -->
<div id="tv" class="page active">
  <h1>📺 TV</h1>

  <div class="box" id="tvStatus">TV: UIT</div>
  <div class="box" id="channel">Zender: 1</div>
  <div class="box" id="volume">Volume: 10</div>

  <button onclick="tvOn()">AAN</button>
  <button onclick="tvOff()">UIT</button>

  <button onclick="chUp()">Zender +</button>
  <button onclick="chDown()">Zender -</button>

  <button onclick="volUp()">Volume +</button>
  <button onclick="volDown()">Volume -</button>
</div>

<!-- CALL -->
<div id="call" class="page">
  <h1>📞 BELLEN</h1>

  <button class="white" onclick="window.open('tel:112')">🚨 NOOD</button>
  <button class="white" onclick="callZorg()">👩‍⚕️ ZORG</button>
  <button class="white" onclick="callFam()">👨‍👩‍👧 FAMILIE</button>
</div>

<!-- REMINDER -->
<div id="rem" class="page">
  <h1>⏰ HERINNERING</h1>

  <input id="text" placeholder="Wat moet er gebeuren?">
  <input id="time" type="time">

  <button onclick="addRem()">OPSLAAN</button>

  <div id="list"></div>
</div>

<!-- MENU -->
<div id="menu">
  <button onclick="show('tv')">📺 TV</button>
  <button onclick="show('call')">📞 BELLEN</button>
  <button onclick="show('rem')">⏰ HERINNERING</button>
</div>

<script>

/* NAV */
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ======================
   TV
====================== */

let tvOnState = false;
let channel = 1;
let volume = 10;
const MAX_VOLUME = 20;

function tvOn(){
  tvOnState = true;
  document.getElementById("tvStatus").innerText = "TV: AAN";
}

function tvOff(){
  tvOnState = false;
  document.getElementById("tvStatus").innerText = "TV: UIT";
}

function chUp(){
  channel++;
  document.getElementById("channel").innerText = "Zender: " + channel;
}

function chDown(){
  if(channel > 1) channel--;
  document.getElementById("channel").innerText = "Zender: " + channel;
}

function volUp(){
  if(volume < MAX_VOLUME){
    volume++;
  }
  document.getElementById("volume").innerText = "Volume: " + volume;
}

function volDown(){
  if(volume > 0){
    volume--;
  }
  document.getElementById("volume").innerText = "Volume: " + volume;
}

/* ======================
   BELLEN
====================== */

function callZorg(){
  let n = localStorage.getItem("zorgNum");
  if(n) window.open("tel:" + n);
  else alert("Geen nummer opgeslagen");
}

function callFam(){
  let n = localStorage.getItem("famNum");
  if(n) window.open("tel:" + n);
  else alert("Geen nummer opgeslagen");
}

/* ======================
   HERINNERINGEN
====================== */

function addRem(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  arr.push({
    text: text.value,
    time: time.value
  });

  localStorage.setItem("rem", JSON.stringify(arr));
  loadRem();
}

function delRem(i){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");
  arr.splice(i,1);
  localStorage.setItem("rem", JSON.stringify(arr));
  loadRem();
}

function loadRem(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  list.innerHTML = arr.map((r,i)=>`
    <div class="box">
      ${r.text} - ${r.time}
      <button onclick="delRem(${i})">❌ verwijderen</button>
    </div>
  `).join("");
}

loadRem();

</script>

</body>
</html>
