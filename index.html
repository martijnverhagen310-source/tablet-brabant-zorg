<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zorg App</title>

<style>
html, body {
  margin: 0;
  font-family: Arial;
  background: #6bb6ff;
  text-align: center;
}

/* kleine dev knop */
#devBtn {
  position: fixed;
  top: 5px;
  left: 5px;
  font-size: 14px;
  opacity: 0.2;
  width: 40px;
  height: 40px;
}

/* pagina */
.section {
  padding: 20px;
}

button {
  width: 95%;
  height: 110px;
  margin: 10px;
  font-size: 28px;
  border-radius: 20px;
  border: none;
}

.box {
  background: white;
  padding: 15px;
  margin: 10px;
  border-radius: 15px;
}

/* dev scherm */
#devPanel {
  display: none;
  background: white;
  position: fixed;
  top: 10%;
  left: 10%;
  width: 80%;
  padding: 20px;
  border-radius: 20px;
}
</style>
</head>

<body>

<!-- DEV BUTTON -->
<button id="devBtn" onclick="openDev()">🔧</button>

<h1 id="name">Patiënt</h1>

<!-- TV -->
<div class="section">
<h2>📺 TV</h2>

<div class="box" id="tvStatus">TV: UIT</div>
<div class="box" id="volume">Volume: 10</div>

<button onclick="tvOn()">AAN</button>
<button onclick="tvOff()">UIT</button>

<button onclick="volUp()">Volume +</button>
<button onclick="volDown()">Volume -</button>
</div>

<!-- BELLEN -->
<div class="section">
<h2>📞 BELLEN</h2>

<button onclick="callZorg()">👩‍⚕️ Zorg</button>
<button onclick="callFam()">👨‍👩‍👧 Familie</button>
</div>

<!-- HERINNERING -->
<div class="section">
<h2>⏰ HERINNERING</h2>

<input id="text" placeholder="Wat moet er gebeuren?">
<button onclick="addRem()">Opslaan</button>

<div id="list"></div>
</div>

<!-- DEV PANEL -->
<div id="devPanel">
  <h2>🔧 Dev modus</h2>

  <input id="newName" placeholder="Naam patiënt">
  <button onclick="saveName()">Opslaan naam</button>

  <input id="zorgNum" placeholder="Zorg nummer">
  <button onclick="saveZorg()">Opslaan zorg nummer</button>

  <input id="famNum" placeholder="Familie nummer">
  <button onclick="saveFam()">Opslaan familie nummer</button>

  <button onclick="closeDev()">Sluiten</button>
</div>

<script>

/* ======================
   DEV MODE
====================== */

function openDev(){
  let code = prompt("Voer code in");
  if(code === "1234"){
    document.getElementById("devPanel").style.display = "block";
  }
}

function closeDev(){
  document.getElementById("devPanel").style.display = "none";
}

/* ======================
   OPSLAAN DATA
====================== */

function saveName(){
  localStorage.setItem("name", newName.value);
  load();
}

function saveZorg(){
  localStorage.setItem("zorgNum", zorgNum.value);
}

function saveFam(){
  localStorage.setItem("famNum", famNum.value);
}

function load(){
  document.getElementById("name").innerText =
    localStorage.getItem("name") || "Patiënt";
}

/* ======================
   TV
====================== */

let volume = 10;
const MAX_VOLUME = 20;

function tvOn(){
  tvStatus.innerText = "TV: AAN";
}

function tvOff(){
  tvStatus.innerText = "TV: UIT";
}

function volUp(){
  if(volume < MAX_VOLUME){
    volume++;
  }
  document.getElementById("volume").innerText = "Volume: " + volume;
}

function volDown(){
  if(volume > 0){
    volume--;
  }
  document.getElementById("volume").innerText = "Volume: " + volume;
}

/* ======================
   BELLEN
====================== */

function callZorg(){
  let n = localStorage.getItem("zorgNum");
  if(n) window.open("tel:" + n);
}

function callFam(){
  let n = localStorage.getItem("famNum");
  if(n) window.open("tel:" + n);
}

/* ======================
   HERINNERING
====================== */

function addRem(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  arr.push(text.value);
  localStorage.setItem("rem", JSON.stringify(arr));
  loadRem();
}

function loadRem(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  list.innerHTML = arr.map((r,i)=>`
    <div class="box">
      ${r}
      <button onclick="delRem(${i})">❌</button>
    </div>
  `).join("");
}

function delRem(i){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");
  arr.splice(i,1);
  localStorage.setItem("rem", JSON.stringify(arr));
  loadRem();
}

load();
loadRem();

</script>

</body>
</html>
