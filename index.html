<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zorg App</title>

<style>
html, body {
  margin: 0;
  font-family: Arial;
  background: #6bb6ff;
  text-align: center;
  overflow-y: scroll;
  scroll-behavior: smooth;
}

button {
  width: 95%;
  height: 110px;
  margin: 10px;
  font-size: 30px;
  border-radius: 20px;
  border: none;
}

.box {
  background: white;
  padding: 15px;
  margin: 10px;
  border-radius: 15px;
  font-size: 22px;
}

/* pijltjes */
#arrows {
  position: fixed;
  right: 10px;
  bottom: 20px;
}

#arrows button {
  width: 80px;
  height: 80px;
  font-size: 30px;
  margin: 5px;
}
</style>
</head>

<body>

<!-- TV -->
<h1>📺 TV</h1>

<div class="box" id="tvStatus">TV: UIT</div>
<div class="box" id="channel">Zender: 1</div>
<div class="box" id="volume">Volume: 10</div>

<button onclick="tvOn()">AAN</button>
<button onclick="tvOff()">UIT</button>

<button onclick="chUp()">Zender +</button>
<button onclick="chDown()">Zender -</button>

<button onclick="volUp()">Volume +</button>
<button onclick="volDown()">Volume -</button>

<hr>

<!-- BELLEN -->
<h1>📞 BELLEN</h1>

<button onclick="window.open('tel:112')">🚨 NOOD</button>
<button onclick="callZorg()">👩‍⚕️ ZORG</button>
<button onclick="callFam()">👨‍👩‍👧 FAMILIE</button>

<hr>

<!-- HERINNERING -->
<h1>⏰ HERINNERING</h1>

<input id="text" placeholder="Wat moet er gebeuren?">
<input id="time" type="time">

<button onclick="addRem()">OPSLAAN</button>

<div id="list"></div>

<!-- PIJLTJES -->
<div id="arrows">
  <button onclick="scrollUp()">⬆️</button>
  <button onclick="scrollDown()">⬇️</button>
</div>

<script>

/* SCROLL FUNCTIES */
function scrollUp(){
  window.scrollBy({ top: -400, behavior: "smooth" });
}

function scrollDown(){
  window.scrollBy({ top: 400, behavior: "smooth" });
}

/* TV */
let tvOnState = false;
let channel = 1;
let volume = 10;
const MAX_VOLUME = 20;

function tvOn(){
  tvOnState = true;
  document.getElementById("tvStatus").innerText = "TV: AAN";
}

function tvOff(){
  tvOnState = false;
  document.getElementById("tvStatus").innerText = "TV: UIT";
}

function chUp(){
  channel++;
  document.getElementById("channel").innerText = "Zender: " + channel;
}

function chDown(){
  if(channel > 1) channel--;
  document.getElementById("channel").innerText = "Zender: " + channel;
}

function volUp(){
  if(volume < MAX_VOLUME){
    volume++;
  }
  document.getElementById("volume").innerText = "Volume: " + volume;
}

function volDown(){
  if(volume > 0){
    volume--;
  }
  document.getElementById("volume").innerText = "Volume: " + volume;
}

/* BELLEN */
function callZorg(){
  let n = localStorage.getItem("zorgNum");
  if(n) window.open("tel:" + n);
  else alert("Geen nummer opgeslagen");
}

function callFam(){
  let n = localStorage.getItem("famNum");
  if(n) window.open("tel:" + n);
  else alert("Geen nummer opgeslagen");
}

/* HERINNERINGEN */
function addRem(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  arr.push({
    text: text.value,
    time: time.value
  });

  localStorage.setItem("rem", JSON.stringify(arr));
  loadRem();
}

function delRem(i){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");
  arr.splice(i,1);
  localStorage.setItem("rem", JSON.stringify(arr));
  loadRem();
}

function loadRem(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  list.innerHTML = arr.map((r,i)=>`
    <div class="box">
      ${r.text} - ${r.time}
      <button onclick="delRem(${i})">❌</button>
    </div>
  `).join("");
}

loadRem();

</script>

</body>
</html>
