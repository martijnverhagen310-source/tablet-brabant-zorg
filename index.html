<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zorg Tablet</title>

<style>
html, body {
  margin: 0;
  font-family: Arial;
  background: #6bb6ff;
  text-align: center;
}

.page { display:none; padding: 20px; }
.active { display:block; }

button {
  width: 95%;
  height: 110px;
  margin: 10px;
  font-size: 30px;
  border-radius: 20px;
  border: none;
}

.box {
  background: white;
  padding: 15px;
  margin: 10px;
  border-radius: 15px;
  font-size: 22px;
}

#menu {
  display: flex;
  position: fixed;
  bottom: 0;
  width: 100%;
}

#menu button {
  flex: 1;
  height: 80px;
  font-size: 18px;
  border: none;
}
</style>
</head>

<body>

<!-- TV -->
<div id="tv" class="page active">
  <h1>📺 TV</h1>

  <div class="box" id="tvStatus">TV: UIT</div>
  <div class="box" id="channel">Zender: 1</div>
  <div class="box" id="volume">Volume: 10</div>

  <button onclick="tvOn()">AAN</button>
  <button onclick="tvOff()">UIT</button>

  <button onclick="chUp()">Zender +</button>
  <button onclick="chDown()">Zender -</button>

  <button onclick="volUp()">Volume +</button>
  <button onclick="volDown()">Volume -</button>
</div>

<!-- BELLEN + NUMMERS -->
<div id="call" class="page">
  <h1>📞 BELLEN</h1>

  <input id="zorgNum" placeholder="Zorg nummer">
  <button onclick="saveZorg()">Sla zorg nummer op</button>

  <input id="famNum" placeholder="Familie nummer">
  <button onclick="saveFam()">Sla familie nummer op</button>

  <div class="box" id="savedNumbers"></div>

  <button onclick="callZorg()">👩‍⚕️ Bel zorg</button>
  <button onclick="callFam()">👨‍👩‍👧 Bel familie</button>
</div>

<!-- HERINNERING -->
<div id="rem" class="page">
  <h1>⏰ HERINNERING</h1>

  <input id="text" placeholder="Wat moet er gebeuren?">
  <input id="time" type="time">
  <button onclick="addRem()">Toevoegen</button>

  <div id="list"></div>
</div>

<!-- MENU -->
<div id="menu">
  <button onclick="show('tv')">📺 TV</button>
  <button onclick="show('call')">📞 BELLEN</button>
  <button onclick="show('rem')">⏰ HERINNERING</button>
</div>

<script>

/* NAV */
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ======================
   TV
====================== */

let tvOnState = false;
let channel = 1;
let volume = 10;

function tvOn(){
  tvOnState = true;
  tvStatus.innerText = "TV: AAN";
}

function tvOff(){
  tvOnState = false;
  tvStatus.innerText = "TV: UIT";
}

function chUp(){
  channel++;
  document.getElementById("channel").innerText = "Zender: " + channel;
}

function chDown(){
  if(channel > 1) channel--;
  document.getElementById("channel").innerText = "Zender: " + channel;
}

function volUp(){
  volume++;
  document.getElementById("volume").innerText = "Volume: " + volume;
 const MAX_VOLUME = 50;
  function volUp(){
  if(volume < MAX_VOLUME){
    volume++;
  }
  document.getElementById("volume").innerText = "Volume: " + volume;
}
}

function volDown(){
  if(volume > 0) volume--;
  document.getElementById("volume").innerText = "Volume: " + volume;
}

/* ======================
   NUMMERS OPSLAAN
====================== */

function saveZorg(){
  localStorage.setItem("zorgNum", zorgNum.value);
  loadNumbers();
}

function saveFam(){
  localStorage.setItem("famNum", famNum.value);
  loadNumbers();
}

function loadNumbers(){
  savedNumbers.innerHTML = `
    <div class="box">👩‍⚕️ Zorg: ${localStorage.getItem("zorgNum") || "-"}</div>
    <div class="box">👨‍👩‍👧 Familie: ${localStorage.getItem("famNum") || "-"}</div>
  `;
}

function callZorg(){
  let n = localStorage.getItem("zorgNum");
  if(n) window.open("tel:" + n);
}

function callFam(){
  let n = localStorage.getItem("famNum");
  if(n) window.open("tel:" + n);
}

/* ======================
   HERINNERINGEN
====================== */

function addRem(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  arr.push({
    text: text.value,
    time: time.value
  });

  localStorage.setItem("rem", JSON.stringify(arr));
  loadRem();
}

function delRem(i){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");
  arr.splice(i,1);
  localStorage.setItem("rem", JSON.stringify(arr));
  loadRem();
}

function loadRem(){
  let arr = JSON.parse(localStorage.getItem("rem") || "[]");

  list.innerHTML = arr.map((r,i)=>`
    <div class="box">
      ${r.text} - ${r.time}
      <button onclick="delRem(${i})">❌ verwijderen</button>
    </div>
  `).join("");
}

loadNumbers();
loadRem();

</script>

</body>
</html>
